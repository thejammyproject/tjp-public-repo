apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thejammyproject-docs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thejammyproject/tjp-public-repo.git
    targetRevision: main
    path: deploy/k8s/docs-thejammyproject
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
