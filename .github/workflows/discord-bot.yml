name: Build Discord bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - python/discord-bot/**
      - .dockerignore
      - .github/workflows/discord-bot.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python/discord-bot/Dockerfile
          push: true
          tags: jammyuk/tjp-discord-bot:${{ github.sha }}

      - name: Pin the deployed image digest
        env:
          IMAGE: jammyuk/tjp-discord-bot@${{ steps.build.outputs.digest }}
        run: |
          sed -i "s|image: jammyuk/tjp-discord-bot.*|image: ${IMAGE}|" deploy/k8s/discord-bot/deployment.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/k8s/discord-bot/deployment.yaml
          git diff --cached --quiet || git commit -m "Deploy Discord bot ${GITHUB_SHA::12} [skip ci]"
          git push
