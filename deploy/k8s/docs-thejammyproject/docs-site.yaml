apiVersion: apps/v1
kind: Deployment
metadata:
  name: thejammyproject-docs
  namespace: platform-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thejammyproject-docs
  template:
    metadata:
      labels:
        app: thejammyproject-docs
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: thejammyproject-docs
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: jammyuk/thejammyproject-docs@sha256:71c2e4f5e891383a4ffc2c5396d8afe1ebecfdca5dd335464b2e5fb7d756b553
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thejammyproject-docs
  namespace: platform-apps
spec:
  selector:
    app: thejammyproject-docs
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thejammyproject-docs-internal
  namespace: platform-apps
spec:
  secretName: thejammyproject-docs-internal-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - docs.thejammyproject.internal
  issuerRef:
    name: local-platform-ca
    kind: Issuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thejammyproject-docs
  namespace: platform-apps
spec:
  ingressClassName: traefik
  tls:
    - secretName: thejammyproject-docs-internal-tls
      hosts:
        - docs.thejammyproject.internal
  rules:
    - host: docs.thejammyproject.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thejammyproject-docs
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thejammyproject-docs-ingress
  namespace: platform-apps
spec:
  podSelector:
    matchLabels:
      app: thejammyproject-docs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
