name: Build documentation website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - website/docs.thejammyproject.internal/**
      - .dockerignore
      - .github/workflows/docs-website.yml

permissions:
  contents: write

concurrency:
  group: container-image-manifest-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website/docs.thejammyproject.internal/Dockerfile
          push: true
          tags: jammyuk/thejammyproject-docs:${{ github.sha }}

      - name: Pin the deployed image digest
        env:
          IMAGE: jammyuk/thejammyproject-docs@${{ steps.build.outputs.digest }}
        run: |
          sed -i "s|image: jammyuk/thejammyproject-docs.*|image: ${IMAGE}|" deploy/k8s/docs-thejammyproject/docs-site.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/k8s/docs-thejammyproject/docs-site.yaml
          git diff --cached --quiet || git commit -m "Deploy docs ${GITHUB_SHA::12} [skip ci]"
          git pull --rebase origin main
          git push
