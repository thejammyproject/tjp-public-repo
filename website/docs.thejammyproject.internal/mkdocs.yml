site_name: The Jammy Project Docs
site_description: Practical Linux, cloud, and infrastructure notes
site_url: https://docs.thejammyproject.internal/
repo_url: https://github.com/thejammyproject/tjp-public-repo
repo_name: thejammyproject/tjp-public-repo
edit_uri: edit/main/website/docs.thejammyproject.internal/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Linux CLI:
      - awk: linux/cli/awk.md
      - Bash basics: linux/cli/bash-basics.md
      - CPU and load: linux/cli/cpu-load.md
      - Cron and systemd timers: linux/cli/cron-and-systemd-timers.md
      - curl: linux/cli/curl.md
      - cut, sort, uniq, and tr: linux/cli/cut-sort-uniq-tr.md
      - Disk and storage: linux/cli/disk-storage.md
      - DNS: linux/cli/dns.md
      - find: linux/cli/find.md
      - grep: linux/cli/grep.md
      - journalctl: linux/cli/journalctl.md
      - jq: linux/cli/jq.md
      - less, head, tail, and wc: linux/cli/less-head-tail-wc.md
      - Linux filesystem: linux/cli/linux-filesystem.md
      - Logs and troubleshooting: linux/cli/logs-troubleshooting.md
      - Memory: linux/cli/memory.md
      - Networking: linux/cli/networking.md
      - Permissions: linux/cli/permissions.md
      - Pipes and redirection: linux/cli/pipes-redirection.md
      - proc filesystem: linux/cli/proc-filesystem.md
      - Processes: linux/cli/processes.md
      - rsync: linux/cli/rsync.md
      - sed: linux/cli/sed.md
      - Signals: linux/cli/signals.md
      - SSH: linux/cli/ssh.md
      - systemd: linux/cli/systemd.md
      - tar, gzip, and ZIP: linux/cli/tar-gzip-zip.md
      - Users and groups: linux/cli/users-groups.md
      - xargs: linux/cli/xargs.md
